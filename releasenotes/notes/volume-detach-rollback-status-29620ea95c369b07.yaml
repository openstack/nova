fixes:
  - |
    Previously, if a request to detach a Cinder volume failed at the call to
    delete the attachment via Cinder API, the volume status remained
    "detaching" instead of being returned to "in-use". The "detaching" status
    prevented subsequent retries of a detach request from being able to succeed
    as they were rejected for the volume not being "in-use". This has been
    fixed to roll back the volume status to "in-use" if a volume detach fails
    at the Cinder API call. See `bug 2016173`_ for more details.

    .. _bug 2016173: https://bugs.launchpad.net/nova/+bug/2016173
