---
features:
  - |
    Graceful shutdown now uses a task tracking mechanism instead of a fixed
    time based sleep to wait for in-progress tasks to finish. When
    ``nova-compute``, ``nova-conductor`` or ``nova-scheduler`` receives
    ``SIGTERM``, the service manager logs all in-progress tasks and waits
    only until they complete (or until
    ``[DEFAULT]/manager_shutdown_timeout`` is reached), instead of
    always sleeping for the full timeout.
known_issues:
  - |
    There is a known issue where a migration-related task tracked on the
    destination compute service may be left in-progress if an error on
    the source compute ends the operation without notifying the
    destination. Since the source and destination compute services
    track their tasks independently, the source has no way to end the
    task tracked on the destination in this case, leaving it reported as
    still in-progress. Due to this bug, destination ``nova-compute``
    service shutdown may take the full configured
    ``[DEFAULT]/manager_shutdown_timeout`` to shutdown, instead of
    exiting as soon as the operation actually ends. Two known cases of
    this are:

    * The ``live_migration_at_dest`` task being left in-progress if the
      live migration is rolled back during ``pre_live_migration``.
    * The ``prep_resize_at_dest`` task being left in-progress if
      ``resize_instance``/cold migration fails on the source compute
      before it hands off to ``finish_resize`` on the destination.

    See `bug 2166009 <https://bugs.launchpad.net/nova/+bug/2166009>`_
    for more details.
