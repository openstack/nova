    - name: "Source cold migration: Set fact if migration is completed or timed out before SIGTERM"
      set_fact:
        cold_migrations_completed_or_timeout: "{{ start_cold_migrations_result.rc == 2 }}"

    - name: "Source cold migration: Run graceful shutdown tests"
      when: not cold_migrations_completed_or_timeout
