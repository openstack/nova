- name: Graceful shutdown while building instance
  block:
    - name: "Build instance: Build instance on subnode"
      become: true
      become_user: stack
      script: "build_instance.sh"
      environment:
        SUBNODE_HOSTNAME: "{{ hostvars['compute1']['ansible_hostname'] }}"
      register: build_instance_result
      failed_when: build_instance_result.rc not in [0, 2]

    - name: "Build instance: Set fact if build completed before SIGTERM"
      set_fact:
        build_completed_or_error: "{{ build_instance_result.rc == 2 }}"

    - name: "Build instance: Run graceful shutdown tests"
      when: not build_completed_or_error
      block:
        - name: "Build instance: Send SIGTERM to subnode compute service"
          delegate_to: compute1
          become: true
          shell: "kill -15 $(systemctl show devstack@n-cpu -p MainPID --value)"

        - name: "Build instance: Verify build instance is completed and it is in active state"
          become: true
          become_user: stack
          script: "verify_build_instance.sh"

        - name: "Build instance: Sleep for graceful_shutdown_timeout to allow subnode compute service graceful shutdown to complete"
          pause:
            seconds: "{{ graceful_shutdown_timeout }}"

        - name: "Build instance: Verify subnode compute service is stopped after graceful shutdown"
          become: true
          become_user: stack
          script: "start_and_verify_compute_service.sh {{ hostvars['compute1']['ansible_hostname'] }} inactive {{ report_interval }} {{ service_down_time }}"

    - name: "Build instance: Verify subnode compute service is running"
      become: true
      become_user: stack
      script: "start_and_verify_compute_service.sh {{ hostvars['compute1']['ansible_hostname'] }}"

    - name: "Build instance: Cleanup test servers"
      become: true
      become_user: stack
      script: "cleanup_test_servers.sh server-build"
      ignore_errors: true

- name: Graceful shutdown revert resize
  block:
    - name: "Revert resize: Start revert resize of test server"
      become: true
      become_user: stack
      script: "start_revert_resize.sh"
      environment:
        SUBNODE_HOSTNAME: "{{ hostvars['compute1']['ansible_hostname'] }}"
        CONTROLLER_HOSTNAME: "{{ hostvars['controller']['ansible_hostname'] }}"
      register: start_revert_resize_result
      failed_when: start_revert_resize_result.rc not in [0, 2]

    - name: "Revert resize: Set fact if revert resize completed before SIGTERM"
      set_fact:
        revert_resize_not_done: "{{ start_revert_resize_result.rc == 2 }}"

    - name: "Revert resize: Run graceful shutdown tests"
      when: not revert_resize_not_done
      block:
        - name: "Revert resize: Send SIGTERM to controller during revert resize"
          delegate_to: controller
          become: true
          shell: "kill -15 $(systemctl show devstack@n-cpu -p MainPID --value)"

        - name: "Revert resize: Verify revert resize is completed during graceful shutdown"
          become: true
          become_user: stack
          script: "verify_revert_resize.sh"
          environment:
            SUBNODE_HOSTNAME: "{{ hostvars['compute1']['ansible_hostname'] }}"

        - name: "Revert resize: Sleep for graceful_shutdown_timeout to allow compute service graceful shutdown to complete"
          pause:
            seconds: "{{ graceful_shutdown_timeout }}"

        - name: "Revert resize: Verify compute service is stopped after graceful shutdown"
          become: true
          become_user: stack
          script: "start_and_verify_compute_service.sh {{ hostvars['controller']['ansible_hostname'] }} inactive {{ report_interval }} {{ service_down_time }}"

    - name: "Revert resize: Start and verify source compute service is running"
      become: true
      become_user: stack
      script: "start_and_verify_compute_service.sh {{ hostvars['controller']['ansible_hostname'] }}"

    - name: "Revert resize: Cleanup test servers"
      become: true
      become_user: stack
      script: "cleanup_test_servers.sh server-rr"
      ignore_errors: true

- name: Fail if any test is skipped
  fail:
    msg: "One or more test is skipped due to operation is either completed or timed out before SIGTERM signal."
  when: live_migrations_completed_or_timeout or cold_migrations_completed_or_timeout or
        live_migrations_completed_or_timeout_dest or cold_migrations_completed_or_timeout_dest or
        build_completed_or_error or revert_resize_not_done
