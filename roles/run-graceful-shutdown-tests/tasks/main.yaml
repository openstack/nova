- name: Set graceful shutdown related timeouts from job vars
  set_fact:
    report_interval: "{{ service_report_interval }}"
    service_down_time: "{{ (service_report_interval | int) * 6 }}"

- name: Graceful shutdown source compute live migration
  block:
    - name: "Source live migration: Start live migrations of test servers"
      become: true
      become_user: stack
      script: "start_live_migration.sh server-lm1"
      environment:
        SUBNODE_HOSTNAME: "{{ hostvars['compute1']['ansible_hostname'] }}"
        CONTROLLER_HOSTNAME: "{{ hostvars['controller']['ansible_hostname'] }}"
      register: start_live_migrations_result
      failed_when: start_live_migrations_result.rc not in [0, 2]

    - name: "Source live migration: Set fact if migrations completed or timed out before SIGTERM"
      set_fact:
        live_migrations_completed_or_timeout: "{{ start_live_migrations_result.rc == 2 }}"

    - name: "Source live migration: Run graceful shutdown tests"
      when: not live_migrations_completed_or_timeout
      block:
        - name: "Source live migration: Send SIGTERM to source compute to start the graceful shutdown"
          delegate_to: compute1
          become: true
          shell: "kill -15 $(systemctl show devstack@n-cpu -p MainPID --value)"

        - name: "Source live migration: Verify live migration is completed during graceful shutdown"
          become: true
          become_user: stack
          script: "verify_live_migration.sh server-lm1"
          environment:
            CONTROLLER_HOSTNAME: "{{ hostvars['controller']['ansible_hostname'] }}"

        - name: "Source live migration: Sleep for graceful_shutdown_timeout to allow compute service graceful shutdown to complete"
          pause:
            seconds: "{{ graceful_shutdown_timeout }}"

        - name: "Source live migration: Verify compute service is stopped after graceful shutdown"
          become: true
          become_user: stack
          script: "start_and_verify_compute_service.sh {{ hostvars['compute1']['ansible_hostname'] }} inactive {{ report_interval }} {{ service_down_time }}"

    - name: "Source live migration: Start and verify subnode compute service is running"
      become: true
      become_user: stack
      script: "start_and_verify_compute_service.sh {{ hostvars['compute1']['ansible_hostname'] }}"

    - name: "Source live migration: Cleanup test servers"
      become: true
      become_user: stack
      script: "cleanup_test_servers.sh server-lm1"
      ignore_errors: true

